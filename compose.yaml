services:
  backend:
    build: .
    ports:
      - "127.0.0.1:8001:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/workouts', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: workouts
      POSTGRES_USER: workouts
      POSTGRES_PASSWORD: workouts_dev
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./sql/001_init.sql:/docker-entrypoint-initdb.d/001_init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workouts -d workouts"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
